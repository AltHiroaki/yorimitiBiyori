name: yorimichi_biyori
description: A Flutter app that suggests small actions from the user's interests during short free-time gaps.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^22.0.1
  flutter_timezone: ^5.0.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/suggestions/
  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/zen_maru_gothic/ZenMaruGothic-Bold.ttf
          weight: 700

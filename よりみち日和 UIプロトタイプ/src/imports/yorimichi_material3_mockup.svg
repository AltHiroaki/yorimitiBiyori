<text x="988" y="532" font-size="12" font-weight="400" fill="#5D6358" text-anchor="start">空き時間のきっかけを受け取る</text>
<rect x="1246" y="496" width="48" height="28" fill="#3F6F44" rx="14" opacity="1" />
<circle cx="1280" cy="510" r="10" fill="#FFFFFF" />
<text x="964" y="594" font-size="18" font-weight="700" fill="#1A1C18" text-anchor="start">データ</text>
<rect x="964" y="610" width="354" height="164" fill="#FFFFFF" rx="24" opacity="1" stroke="#DFE6D9" stroke-width="1" />

<?xml version="1.0" encoding="UTF-8"?>
<svg width="1380" height="980" viewBox="0 0 1380 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#223322" flood-opacity="0.10"/>
    </filter>
    <style>
      text {
        font-family: Inter, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        dominant-baseline: alphabetic;
      }
    </style>
  </defs>
  <rect x="0" y="0" width="1380" height="980" fill="#F2F4ED" rx="0" opacity="1" />
  <text x="40" y="46" font-size="24" font-weight="800" fill="#1A1C18" text-anchor="start">よりみち日和 - Material 3風 UIモック</text>
  <text x="40" y="76" font-size="14" font-weight="400" fill="#5D6358" text-anchor="start">3タブ構成: 提案 / 履歴 / 設定。ホームは削除し、提案画面を初期表示にする想定。Flutterでは NavigationBar + IndexedStack で実装しやすい構成。</text>
  <g filter="url(#softShadow)">
    <g id="01 提案画面 - Main">
<rect x="40" y="120" width="402" height="874" fill="#F8FBF3" rx="32" opacity="1" stroke="#E2E7DB" stroke-width="1" />
<text x="48" y="106" font-size="14" font-weight="700" fill="#5D6358" text-anchor="start">01 提案画面 - Main</text>
<text x="64" y="151" font-size="14" font-weight="700" fill="#1A1C18" text-anchor="start">9:41</text>
<rect x="350" y="140" width="18" height="10" fill="#1A1C18" rx="4" opacity="1" />
<rect x="374" y="140" width="16" height="10" fill="#1A1C18" rx="4" opacity="1" />
<rect x="400" y="138" width="26" height="13" fill="#FFFFFF" rx="4" opacity="1" stroke="#1A1C18" stroke-width="1.2" />
<rect x="404" y="141" width="17" height="7" fill="#1A1C18" rx="2" opacity="1" />
<text x="64" y="214" font-size="28" font-weight="800" fill="#1A1C18" text-anchor="start">よりみち日和</text>
<text x="64" y="242" font-size="14" font-weight="400" fill="#5D6358" text-anchor="start">空いた時間に、小さなよりみちを。</text>
<text x="64" y="280" font-size="16" font-weight="700" fill="#1A1C18" text-anchor="start">今ある時間</text>
<rect x="64" y="296" width="88" height="40" fill="#C2E8C0" rx="20" opacity="1" stroke="#3F6F44" stroke-width="1" />
<text x="108.0" y="322" font-size="14" font-weight="700" fill="#0B2A10" text-anchor="middle">15分</text>
<rect x="160" y="296" width="88" height="40" fill="#FFFFFF" rx="20" opacity="1" stroke="#C4CCBD" stroke-width="1" />
<text x="204.0" y="322" font-size="14" font-weight="700" fill="#5D6358" text-anchor="middle">30分</text>
<rect x="256" y="296" width="88" height="40" fill="#FFFFFF" rx="20" opacity="1" stroke="#C4CCBD" stroke-width="1" />
<text x="300.0" y="322" font-size="14" font-weight="700" fill="#5D6358" text-anchor="middle">60分</text>
<rect x="64" y="366" width="354" height="336" fill="#FFFFFF" rx="28" opacity="1" stroke="#DFE6D9" stroke-width="1" />
<circle cx="108" cy="414" r="20" fill="#C2E8C0" />
<text x="108" y="421" font-size="18" font-weight="700" fill="#3F6F44" text-anchor="middle">◇</text>
<text x="142" y="410" font-size="14" font-weight="700" fill="#3F6F44" text-anchor="start">今日のよりみち</text>
<text x="142" y="434" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">15分でできる</text>
<text x="88" y="496" font-size="30" font-weight="800" fill="#1A1C18" text-anchor="start"><tspan x="88" dy="0">近くを15分だけ</tspan><tspan x="88" dy="37">散歩する</tspan></text>
<text x="88" y="576" font-size="15" font-weight="400" fill="#5D6358" text-anchor="start"><tspan x="88" dy="0">スマホをしまって、いつも通らない道を</tspan><tspan x="88" dy="18">少しだけ歩いてみる。気分転換に向いた</tspan><tspan x="88" dy="18">軽いよりみちです。</tspan></text>
<rect x="88" y="630" width="84" height="32" fill="#EEF5E8" rx="16" opacity="1" />
<text x="130" y="651" font-size="13" font-weight="500" fill="#596E57" text-anchor="middle">気分転換</text>
<rect x="180" y="630" width="64" height="32" fill="#EEF5E8" rx="16" opacity="1" />
<text x="212" y="651" font-size="13" font-weight="500" fill="#596E57" text-anchor="middle">15分</text>
<rect x="80" y="740" width="150" height="48" fill="#3F6F44" rx="24" opacity="1" />
<text x="155.0" y="770" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">やってみる</text>
<rect x="252" y="740" width="150" height="48" fill="#FFFFFF" rx="24" opacity="1" stroke="#C4CCBD" stroke-width="1.2" />
<text x="327.0" y="770" font-size="15" font-weight="700" fill="#3F6F44" text-anchor="middle">別の提案</text>
<rect x="64" y="820" width="354" height="56" fill="#EEF5E8" rx="18" opacity="1" />
<text x="84" y="842" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start"><tspan x="84" dy="0">通知から開いたときも、ここで時間を選んで</tspan><tspan x="84" dy="16">提案を見られます。</tspan></text>
<rect x="40" y="910" width="402" height="84" fill="#FFFFFF" rx="0" opacity="1" />
<line x1="40" y1="910" x2="442" y2="910" stroke="#DFE6D9" stroke-width="1" />
<rect x="89" y="920" width="66" height="32" fill="#C2E8C0" rx="16" opacity="1" />
<text x="122" y="943" font-size="18" font-weight="700" fill="#0B2A10" text-anchor="middle">◇</text>
<text x="122" y="972" font-size="12" font-weight="700" fill="#3F6F44" text-anchor="middle">提案</text>
<text x="241" y="943" font-size="18" font-weight="700" fill="#5D6358" text-anchor="middle">◷</text>
<text x="241" y="972" font-size="12" font-weight="500" fill="#5D6358" text-anchor="middle">履歴</text>
<text x="360" y="943" font-size="18" font-weight="700" fill="#5D6358" text-anchor="middle">○</text>
<text x="360" y="972" font-size="12" font-weight="500" fill="#5D6358" text-anchor="middle">設定</text>
</g>

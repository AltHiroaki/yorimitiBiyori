<text x="800" y="338" font-size="12" font-weight="500" fill="#5D6358" text-anchor="middle">分</text>
<text x="514" y="408" font-size="18" font-weight="700" fill="#1A1C18" text-anchor="start">最近の履歴</text>
<rect x="514" y="426" width="354" height="82" fill="#FFFFFF" rx="20" opacity="1" stroke="#DFE6D9" stroke-width="1" />
<circle cx="554" cy="467" r="20" fill="#C2E8C0" />
<text x="554" y="474" font-size="18" font-weight="800" fill="#3F6F44" text-anchor="middle">✓</text>
<text x="590" y="456" font-size="15" font-weight="700" fill="#1A1C18" text-anchor="start">近くを15分だけ散歩する</text>
<text x="590" y="484" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">6/5  気分転換・15分</text>
<rect x="514" y="520" width="354" height="82" fill="#FFFFFF" rx="20" opacity="1" stroke="#DFE6D9" stroke-width="1" />
<circle cx="554" cy="561" r="20" fill="#F2E8A2" />
<text x="554" y="568" font-size="18" font-weight="800" fill="#7B6F00" text-anchor="middle">−</text>
<text x="590" y="550" font-size="15" font-weight="700" fill="#1A1C18" text-anchor="start">普段聴かない音楽を1曲聴く</text>
<text x="590" y="578" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">6/4  音楽・5分</text>
<rect x="514" y="614" width="354" height="82" fill="#FFFFFF" rx="20" opacity="1" stroke="#DFE6D9" stroke-width="1" />
<circle cx="554" cy="655" r="20" fill="#C2E8C0" />
<text x="554" y="662" font-size="18" font-weight="800" fill="#3F6F44" text-anchor="middle">✓</text>
<text x="590" y="644" font-size="15" font-weight="700" fill="#1A1C18" text-anchor="start">気になるテーマを少し調べる</text>
<text x="590" y="672" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">6/3  学習・30分</text>
<rect x="514" y="708" width="354" height="82" fill="#FFFFFF" rx="20" opacity="1" stroke="#DFE6D9" stroke-width="1" />
<circle cx="554" cy="749" r="20" fill="#C2E8C0" />
<text x="554" y="756" font-size="18" font-weight="800" fill="#3F6F44" text-anchor="middle">✓</text>
<text x="590" y="738" font-size="15" font-weight="700" fill="#1A1C18" text-anchor="start">短い記事を1本読む</text>
<text x="590" y="766" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">6/2  読書・15分</text>
<rect x="490" y="910" width="402" height="84" fill="#FFFFFF" rx="0" opacity="1" />
<line x1="490" y1="910" x2="892" y2="910" stroke="#DFE6D9" stroke-width="1" />

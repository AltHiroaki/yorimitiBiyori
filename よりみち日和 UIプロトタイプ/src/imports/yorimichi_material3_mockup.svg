<text x="988" y="676" font-size="12" font-weight="400" fill="#5D6358" text-anchor="start">端末内に保存した履歴を削除</text>
<text x="1270" y="661" font-size="13" font-weight="500" fill="#BA1A1A" text-anchor="middle">削除</text>
<line x1="988" y1="700" x2="1294" y2="700" stroke="#DFE6D9" stroke-width="1" />

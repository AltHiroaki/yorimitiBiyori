<text x="988" y="364" font-size="12" font-weight="400" fill="#5D6358" text-anchor="start">散歩・音楽・読書・学習</text>
<text x="1270" y="349" font-size="13" font-weight="500" fill="#3F6F44" text-anchor="middle">編集</text>

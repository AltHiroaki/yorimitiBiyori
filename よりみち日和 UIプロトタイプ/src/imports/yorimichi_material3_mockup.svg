<text x="988" y="760" font-size="12" font-weight="400" fill="#5D6358" text-anchor="start">よりみち日和 MVP</text>
<text x="1270" y="745" font-size="13" font-weight="500" fill="#3F6F44" text-anchor="middle">表示</text>
<rect x="964" y="820" width="354" height="48" fill="#EEF5E8" rx="18" opacity="1" />
<text x="984" y="845" font-size="13" font-weight="400" fill="#5D6358" text-anchor="start">MVPではログインなしで、端末内に設定と履歴を保存します。</text>

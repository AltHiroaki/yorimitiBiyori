<text x="572" y="972" font-size="12" font-weight="500" fill="#5D6358" text-anchor="middle">提案</text>
<rect x="658" y="920" width="66" height="32" fill="#C2E8C0" rx="16" opacity="1" />
<text x="691" y="943" font-size="18" font-weight="700" fill="#0B2A10" text-anchor="middle">◷</text>
<text x="691" y="972" font-size="12" font-weight="700" fill="#3F6F44" text-anchor="middle">履歴</text>
<text x="810" y="943" font-size="18" font-weight="700" fill="#5D6358" text-anchor="middle">○</text>
<text x="810" y="972" font-size="12" font-weight="500" fill="#5D6358" text-anchor="middle">設定</text>
</g>
